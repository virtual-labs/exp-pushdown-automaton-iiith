<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/virtual-labs/virtual-style@0.0.8-b/css/style.min.css">
  <link rel="stylesheet" href="./css/main.css">
</head>

<body class="body-padding">
  <div class="container">
    <div class="columns is-centered">
      <div id="instruction-container" class="column ">
        <div class="v-collapsible-instruction-container v-instruction-container instruction-container-background">
          <div id="instruction-title" class="v-collapsible is-size-5">Instructions</div>
          <div class="v-content" style="text-align: left; padding-left: 10%; padding-right: 10%;">
            <ul style="list-style: disc;">
              <li><strong>Change PDFA</strong> switches the PDFA to a different PDFA</li>
              <li><strong>Change Input</strong> changes the input given to the PDFA</li>
              <li><strong>Next Step</strong> displays the next step in PDFA simulation</li>
              <li><strong>Previous Step</strong> displays the previous step in PDFA simulation</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <br><br><br><br>

  <div class="columns is-centered is-flex-direction-row is-flex-wrap-wrap is-align-items-center is-align-content-start">

    <div id="control-container" class="column is-3-desktop is-12-tablet is-12-mobile ">
      <div class="v-datalist-container" style="height:400px;">
        <div class="v-datalist-title">PDFA controls</div>
        <div class="v-datalist-row" id="toolbar"
          style="display: flex; flex-direction: column; justify-content: center; align-items: center; height:100%;">
          <button id="change_pdfa" type="button" name="button" class="v-button">Change PDFA</button>
          <button id="change_input" type="button" name="button" class="v-button">Change Input</button>
          <button id="next" type="button" name="button" class="v-button">Next Step</button>
          <button id="prev" type="button" name="button" class="v-button">Previous Step</button>
        </div>
      </div>
    </div>

    <div class="column is-6-desktop is-12-tablet is-12-mobile">
      <div class="v-datalist-container" style="height:500px; overflow-y:auto;" id="circuit-board">
        <div id="working-area">

          <div id="PDFA_description_container"
            class="is-size-4 is-centered is-flex-direction-row is-align-content-center">
          </div>

          <div id="input_container" class="is-size-1 is-centered is-flex-direction-row is-align-content-center">
          </div>

          <div style="display: flex; flex-direction: row; width: 100%;">

            <div style="flex: 2; display: flex; flex-direction: column; align-items: center;">

              <div id="transition_table_container" style="margin-bottom: 1rem;">
              </div>

              <svg id="canvas1" width="500" height="200" xmlns="http://www.w3.org/2000/svg" style="display: block;">
              </svg>
            </div>

            <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
              <svg id="push_down_stack" width="100" height="200" xmlns="http://www.w3.org/2000/svg">
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="trace-container" class="column is-3-desktop is-12-tablet is-12-mobile">
      <div class="v-datalist-container" style="height:400px;" id="stack_container">
        <div class="v-datalist-title">Steps</div>
        <br>
        <ul id="stack_list" style="height:400px; overflow-y:auto;">
        </ul>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/virtual-labs/virtual-style@0.0.8-b/js/script.js"></script>
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  <script src="./js/helper.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/main.js"></script>
</body>

</html>
